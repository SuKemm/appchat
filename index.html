<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>messaging-app-react</title>
    <script>
      // Set data-theme trên <html> TRƯỚC khi React mount / trước khi
      // trình duyệt vẽ khung hình đầu tiên — tránh nhấp nháy sáng→tối
      // (flash of wrong theme) khi người dùng đã chọn Dark trước đó.
      // Cùng logic mặc định với src/hooks/useTheme.js: ưu tiên lựa
      // chọn đã lưu trong localStorage, nếu chưa có thì theo
      // prefers-color-scheme của hệ thống.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var theme =
            stored === "dark" || stored === "light"
              ? stored
              : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          // localStorage bị chặn (Safari private mode, v.v.) — bỏ
          // qua, mặc định Light theo CSS gốc.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
